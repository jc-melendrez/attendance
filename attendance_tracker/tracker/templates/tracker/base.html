{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Rollcall{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'tracker/app.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-present" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-late" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-absent" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-empty" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" stroke-dasharray="3 3"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  </svg>

  <header class="top wrap">
    <a class="brand" href="{% url 'home' %}">
      <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Rollcall
    </a>
    {% if account %}
    <div class="who">
      <span class="who-name">{{ account.name }}<span class="who-role">{{ account.role|title }}</span></span>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="textbtn" type="submit">Log out</button>
      </form>
    </div>
    {% endif %}
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  {% block after %}{% endblock %}
</body>
</html>
